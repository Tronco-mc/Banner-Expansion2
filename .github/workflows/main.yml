
name: Build Banner Expansion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build mod
        working-directory: BannerExpansion
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BannerExpansion-1.0.0
          path: BannerExpansion/build/libs/*.jar
          if-no-files-found: error

